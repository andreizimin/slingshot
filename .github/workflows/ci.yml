name: ci

# The deploy pipeline (hosting LLD, "Deploy Pipeline"): every push is tested; a passing
# branch deploys to dev and `main` deploys to production, each followed by the live-site
# check against the deployed address.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # @spec HOST-011
  test:
    # Every push; pull requests only from forks (a branch of this repository is
    # already tested by its push).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests and the coherence check use only Node's built-ins: nothing to install.
      - run: npm test
      - run: npm run coherence

  # @spec HOST-013, HOST-014
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # @spec HOST-017
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://slingshot.andreizimin.com' || 'https://slingshot-dev.andreizimin.com' }}
    # @spec HOST-016 — one deploy per stage at a time; a later push waits.
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      cancel-in-progress: false
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      LIVE_URL: ${{ github.ref == 'refs/heads/main' && 'https://slingshot.andreizimin.com' || 'https://slingshot-dev.andreizimin.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No long-lived keys: AWS trusts this repository's dev and production
      # environments through OIDC. The repository is public, so the role is a
      # secret and the account ID is masked in these logs.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - run: npx sst deploy --stage "$STAGE"
      # @spec HOST-015
      - name: Live-site check
        run: npm run test:live
